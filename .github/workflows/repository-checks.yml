name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm no automatic deployment workflow
        shell: bash
        run: |
          if [ -f .github/workflows/deploy.yml ]; then
            echo "::error::Deploy workflow must not be enabled before Gate A approval."
            exit 1
          fi
      - name: Check application only when package files exist
        shell: bash
        run: |
          if [ -f package.json ]; then
            if [ ! -f package-lock.json ]; then
              echo "::error::package-lock.json is required for reproducible builds."
              exit 1
            fi
            npm ci
            npm run typecheck
            npm run build
            npm test -- --run
          else
            echo "Documentation-only repository: application checks pending."
          fi
