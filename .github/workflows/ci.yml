name: CI — build and tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require reproducible lockfile
        run: test -f package-lock.json || { echo "::error::package-lock.json is required before merge"; exit 1; }
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Firebase backend syntax
        run: node --check functions/src/index.mjs && node --check functions/src/login-service.mjs
      - name: Firebase backend policy tests
        run: npm --prefix functions test
